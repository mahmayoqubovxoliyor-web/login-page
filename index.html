<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --color-bg: #FFFFFF;
    --color-text: #14141C;
    --color-text-muted: #6B6B76;
    --color-border: #E3E3E9;
    --color-border-hover: #C7C7D1;
    --color-primary: #5B4FE0;
    --color-primary-hover: #4C41C9;
    --color-primary-active: #3F35AC;
    --color-primary-tint: #EFEDFC;
    --color-success: #2FAE66;
    --color-success-tint: #EAF7EF;
    --color-error: #E5484D;
    --color-error-tint: #FDEDEE;
    --color-info-tint: #F1F0FE;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-pill: 999px;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --shadow-focus: 0 0 0 4px var(--color-primary-tint);
    --container-max: 1180px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; }
  a { color: inherit; }
  .skip-link { position: absolute; left: -999px; top: 0; background: var(--color-text); color: #fff; padding: 10px 16px; border-radius: var(--radius-sm); z-index: 100; }
  .skip-link:focus { left: 16px; top: 16px; }
  :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

  .site-header { max-width: var(--container-max); width: 100%; margin: 0 auto; padding: 28px 32px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .header-left { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--color-text); }
  .brand-logo { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px 9px 14px; border-radius: var(--radius-pill); border: 1px solid var(--color-border); background: #fff; color: var(--color-text); font-size: 14px; font-weight: 500; cursor: pointer; transition: border-color .15s ease, background .15s ease, transform .1s ease; }
  .back-btn:hover { border-color: var(--color-border-hover); background: #FAFAFC; }
  .back-btn:active { transform: translateY(1px); }
  .back-btn svg { width: 15px; height: 15px; }
  .lang-select { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: var(--radius-pill); border: 1px solid var(--color-border); background: #fff; font-size: 14px; font-weight: 500; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
  .lang-select:hover { border-color: var(--color-border-hover); background: #FAFAFC; }

  .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .login-grid { width: 100%; max-width: 720px; display: flex; align-items: center; gap: 72px; }
  .promo-card { width: 314px; height: 314px; min-width: 314px; border-radius: var(--radius-lg); overflow: hidden; position: relative; background: radial-gradient(circle at 25% 18%, rgba(255,255,255,.16), transparent 45%), linear-gradient(150deg, #4C41C9 0%, #5B4FE0 42%, #7A6FF0 78%, #9C8FFF 100%); }
  .promo-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; text-align: center; color: rgba(255,255,255,.92); }
  .promo-placeholder svg { width: 40px; height: 40px; opacity: .85; }
  .promo-placeholder .ph-title { font-size: 15px; font-weight: 600; }
  .promo-placeholder .ph-sub { font-size: 12.5px; color: rgba(255,255,255,.7); max-width: 200px; line-height: 1.5; }

  .login-panel { flex: 1; min-width: 0; }
  .login-title { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  .login-subtext { margin: 0 0 28px; font-size: 14.5px; color: var(--color-text-muted); }
  .login-subtext a, .plain-link { color: var(--color-primary); font-weight: 600; text-decoration: none; cursor: pointer; background: none; border: none; padding: 0; font-size: inherit; font-family: inherit; }
  .login-subtext a:hover, .plain-link:hover { text-decoration: underline; }
  .step-desc { margin: 0 0 20px; font-size: 13.5px; color: var(--color-text-muted); line-height: 1.55; }
  .demo-note { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: #B23237; background: var(--color-error-tint); padding: 7px 14px; border-radius: var(--radius-pill); margin: 0 0 22px; }
  .demo-note svg { width: 14px; height: 14px; flex-shrink: 0; }

  form { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-input-wrap { position: relative; }
  .field input { width: 100%; height: 50px; padding: 0 18px; border-radius: var(--radius-pill); border: 1px solid var(--color-border); background: #fff; font-size: 14.5px; color: var(--color-text); transition: border-color .15s ease, box-shadow .15s ease; }
  .field input::placeholder { color: #A7A7B3; }
  .field input:hover { border-color: var(--color-border-hover); }
  .field input:focus { outline: none; border-color: var(--color-primary); box-shadow: var(--shadow-focus); }
  .field.has-error input { border-color: var(--color-error); }
  .field.has-error input:focus { box-shadow: 0 0 0 4px var(--color-error-tint); }
  .field input[type="password"] { padding-right: 46px; }
  .toggle-pw { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: none; background: transparent; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-text-muted); transition: background .15s ease, color .15s ease; }
  .toggle-pw:hover { background: #F4F4F7; color: var(--color-text); }
  .toggle-pw svg { width: 18px; height: 18px; }
  .field-error { font-size: 12.5px; color: var(--color-error); padding-left: 18px; display: none; }
  .field.has-error .field-error { display: block; }
  .field-hint { font-size: 12px; color: var(--color-text-muted); padding-left: 18px; }

  .form-alert { display: none; align-items: flex-start; gap: 9px; font-size: 13.5px; padding: 11px 16px; border-radius: var(--radius-sm); line-height: 1.5; }
  .form-alert svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
  .form-alert.show { display: flex; }
  .form-alert.error { background: var(--color-error-tint); color: #B23237; }
  .form-alert.success { background: var(--color-success-tint); color: #1F7A48; }
  .form-alert.info { background: var(--color-info-tint); color: #4C41C9; }
  .form-alert code { background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 5px; font-weight: 700; letter-spacing: .04em; }

  .submit-btn { height: 50px; border: none; border-radius: var(--radius-pill); background: var(--color-primary); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; transition: background .15s ease, transform .1s ease, opacity .15s ease; }
  .submit-btn:hover:not(:disabled) { background: var(--color-primary-hover); }
  .submit-btn:active:not(:disabled) { background: var(--color-primary-active); transform: translateY(1px); }
  .submit-btn:disabled { opacity: .75; cursor: not-allowed; }
  .submit-btn.secondary { background: #fff; color: var(--color-text); border: 1px solid var(--color-border); }
  .submit-btn.secondary:hover:not(:disabled) { border-color: var(--color-border-hover); background: #FAFAFC; }
  .spinner { width: 17px; height: 17px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite; display: none; }
  .submit-btn.secondary .spinner { border-color: rgba(0,0,0,.15); border-top-color: var(--color-text); }
  .submit-btn.loading .spinner { display: inline-block; }
  .submit-btn.loading .btn-label { opacity: .85; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.4s; } .back-btn, .lang-select, .field input, .submit-btn, .toggle-pw { transition: none; } }

  .forgot-link { display: inline-block; margin-top: 4px; font-size: 13.5px; color: var(--color-text); text-decoration: none; font-weight: 500; background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; }
  .forgot-link:hover { color: var(--color-primary); text-decoration: underline; }
  .back-step { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--color-text-muted); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 16px; font-family: inherit; }
  .back-step:hover { color: var(--color-text); }
  .back-step svg { width: 14px; height: 14px; }

  .session-card { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
  .session-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; }
  .session-email { font-weight: 600; font-size: 15px; word-break: break-all; }


  .prank-screen {
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080808;
    color: #ff2b2b;
    border-radius: 18px;
    padding: 40px 20px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255,0,0,.12);
  }
  .prank-title {
    font-size: clamp(28px, 5vw, 54px);
    font-weight: 800;
    letter-spacing: .06em;
    line-height: 1.1;
    text-shadow: 0 0 18px rgba(255,0,0,.65);
    animation: prankPulse .75s ease-in-out infinite alternate;
  }
  @keyframes prankPulse { from { opacity: .72; transform: scale(.985); } to { opacity: 1; transform: scale(1.015); } }

  .site-footer { max-width: var(--container-max); width: 100%; margin: 0 auto; padding: 24px 32px 32px; border-top: 1px solid var(--color-border); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--color-text-muted); }
  .footer-links { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .footer-links a { text-decoration: underline; color: var(--color-text-muted); cursor: pointer; }
  .footer-links a:hover { color: var(--color-text); }
  .footer-recaptcha { max-width: 560px; line-height: 1.6; }
  .footer-copyright { white-space: nowrap; }

  @media (max-width: 860px) { .login-grid { gap: 44px; } }
  @media (max-width: 680px) {
    .site-header { padding: 20px 20px 0; }
    .login-main { padding: 28px 20px; }
    .login-grid { flex-direction: column; align-items: stretch; gap: 28px; }
    .promo-card { width: 100%; min-width: 0; height: 200px; }
    .login-title { font-size: 26px; }
  
  .prank-screen {
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080808;
    color: #ff2b2b;
    border-radius: 18px;
    padding: 40px 20px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255,0,0,.12);
  }
  .prank-title {
    font-size: clamp(28px, 5vw, 54px);
    font-weight: 800;
    letter-spacing: .06em;
    line-height: 1.1;
    text-shadow: 0 0 18px rgba(255,0,0,.65);
    animation: prankPulse .75s ease-in-out infinite alternate;
  }
  @keyframes prankPulse { from { opacity: .72; transform: scale(.985); } to { opacity: 1; transform: scale(1.015); } }

  .site-footer { padding: 20px 20px 24px; flex-direction: column; align-items: flex-start; gap: 12px; }
    .footer-copyright { white-space: normal; }
  }
  .toast { display: none; align-items: center; justify-content: space-between; gap: 16px; width: 100%; background: #A7F3D0; color: #0B4A34; padding: 16px 28px; font-size: 15px; font-weight: 500; }
  .toast.show { display: flex; }
  .toast-close { border: none; background: transparent; color: #0B4A34; opacity: .7; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; transition: opacity .15s ease, background .15s ease; }
  .toast-close:hover { opacity: 1; background: rgba(11,74,52,.08); }
  .toast-close svg { width: 18px; height: 18px; }

  @media (max-width: 680px) { .toast { padding: 14px 18px; font-size: 14px; } }
  @media (max-width: 380px) { .header-left { gap: 10px; } .brand-name { font-size: 15.5px; } }
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button class="toast-close" id="toastClose" type="button" aria-label="Dismiss">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
</div>
<a class="skip-link" href="#primary-form">Skip to form</a>

<header class="site-header">
  <div class="header-left">
    <a class="brand" href="#" id="brandLink" aria-label="Homepage">
      <img class="brand-logo" id="brandLogo" alt="" />
      <span class="brand-name" id="brandName"></span>
    </a>
    <button class="back-btn" id="backBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </button>
  </div>
  <button class="lang-select" id="langSelect" type="button">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.8 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.8-3.8-9S9.5 5.6 12 3z"/></svg>
    <span id="langLabel"></span>
  </button>
</header>

<main class="login-main">
  <div class="login-grid">
    <div class="promo-card" id="promoCard" aria-hidden="true">
      <div class="promo-placeholder" id="promoPlaceholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
        <div class="ph-title">Your promotional image</div>
        <div class="ph-sub">Set CONFIG.promoImageUrl to 314×314 (cropped to fill)</div>
      </div>
      <img class="promo-img" id="promoImg" alt="" hidden style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />
    </div>

    <div class="login-panel" id="panel"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-recaptcha" id="footerRecaptcha"></div>
  <div class="footer-links">
    <a id="privacyLink">Privacy Policy</a>
    <a id="termsLink">Terms of Use</a>
    <a id="dmcaLink">Copyright Policy / DMCA</a>
  </div>
  <div class="footer-copyright" id="footerCopyright"></div>
</footer>

  /* ============================================================
     REAL BACKEND
     This calls the Netlify Functions backend at
     /api/auth/signup, /api/auth/login, /api/auth/change-password.
     Passwords are hashed server-side with scrypt and never touch
     localStorage — only a lightweight client-side session marker
     (just the email + timestamp, not a secret) is kept there so the
     page remembers you're signed in across reloads.
     ============================================================ */
  const SESSION_KEY = 'novaframe_session_v1';

  async function callApi(path, body) {
    let res;
    try {
      res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    } catch (err) {
      throw new Error('Could not reach the server. Please try again.');
    }
    let data = {};
    try { data = await res.json(); } catch (e) { /* empty body */ }
    if (!res.ok) throw new Error(data.message || 'Something went wrong.');
    return data;
  }

  const api = {
    async signUp(email, password) {
      const data = await callApi('/api/auth/signup', { email, password });
      localStorage.setItem(SESSION_KEY, JSON.stringify({ email: data.email, since: Date.now() }));
      return data;
    },
    async logIn(email, password) {
      const data = await callApi('/api/auth/login', { email, password });
      localStorage.setItem(SESSION_KEY, JSON.stringify({ email: data.email, since: Date.now() }));
      return data;
    },
    async changePassword(email, oldPassword, newPassword) {
      const data = await callApi('/api/auth/change-password', { email, oldPassword, newPassword });
      localStorage.setItem(SESSION_KEY, JSON.stringify({ email: data.email, since: Date.now() }));
      return data;
    },
    getSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
      catch (e) { return null; }
    },
    logOut() {
      localStorage.removeItem(SESSION_KEY);
    }
  };

  /* ---------------- Chrome (logo / back / lang / footer) ---------------- */
  function applyChrome() {
    document.title = 'Log in · ' + CONFIG.brandName;
    document.documentElement.style.setProperty('--color-primary', CONFIG.primaryColor);
    document.getElementById('brandName').textContent = CONFIG.brandName;
    document.getElementById('brandLink').href = CONFIG.homeHref;
    document.getElementById('backBtn').dataset.href = CONFIG.backHref;
    document.getElementById('langLabel').textContent = CONFIG.language;

    const logoImg = document.getElementById('brandLogo');
    if (CONFIG.logoUrl) {
      logoImg.src = CONFIG.logoUrl;
    } else {
      const initial = CONFIG.brandName.trim().charAt(0).toUpperCase();
      logoImg.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><rect width="30" height="30" rx="8" fill="' + CONFIG.primaryColor + '"/><text x="15" y="20" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">' + initial + '</text></svg>'
      );
    }
    logoImg.alt = CONFIG.brandName + ' logo';

    const promoImg = document.getElementById('promoImg');
    if (CONFIG.promoImageUrl) {
      promoImg.src = CONFIG.promoImageUrl;
      promoImg.hidden = false;
      document.getElementById('promoPlaceholder').hidden = true;
    }

    document.getElementById('footerRecaptcha').innerHTML = CONFIG.footer.recaptchaHtml;
    document.getElementById('footerCopyright').textContent = CONFIG.footer.copyright;
  }
  applyChrome();
  document.getElementById('backBtn').addEventListener('click', function () {
    window.location.href = this.dataset.href || '#';
  });

  document.getElementById('toastClose').addEventListener('click', function () {
    document.getElementById('toast').classList.remove('show');
  });
  function showToast(msg) {
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toast').classList.add('show');
  }
  function displayNameFromEmail(email) {
    const local = (email || '').split('@')[0];
    const parts = local.split(/[._\-+0-9]+/).filter(Boolean);
    const name = parts[0] || local;
    return name.charAt(0).toUpperCase() + name.slice(1);
  }

  /* ---------------- Router / view state ---------------- */
  const panel = document.getElementById('panel');
  let view = api.getSession() ? 'home' : 'login';
  let pendingChangeEmail = '';

  function go(v) { view = v; render(); }

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function eyeSvg(open) {
    return open
      ? '<path d="M3 3l18 18M10.6 10.7a3 3 0 004.2 4.2M6.5 6.6C4 8.3 2.3 10.6 1.5 12c1.6 2.8 5 7.5 10.5 7.5 1.9 0 3.6-.5 5-1.3M17.4 17.4C19.6 15.9 21 12 21 12s-1-2-3-3.8"/>'
      : '<path d="M1.5 12s4-7.5 10.5-7.5S22.5 12 22.5 12s-4 7.5-10.5 7.5S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/>';
  }

  function passwordFieldHtml(id, placeholder) {
    return (
      '<div class="field-input-wrap">' +
        '<input type="password" id="' + id + '" placeholder="' + placeholder + '" autocomplete="new-password" aria-describedby="' + id + 'Error" />' +
        '<button type="button" class="toggle-pw" data-toggle-for="' + id + '" aria-label="Show password" aria-pressed="false">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + eyeSvg(false) + '</svg>' +
        '</button>' +
      '</div>'
    );
  }

  function wireToggles(root) {
    root.querySelectorAll('[data-toggle-for]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const input = document.getElementById(btn.dataset.toggleFor);
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        btn.setAttribute('aria-pressed', String(!visible));
        btn.setAttribute('aria-label', !visible ? 'Hide password' : 'Show password');
        btn.querySelector('svg').innerHTML = eyeSvg(!visible);
      });
    });
  }

  function setFieldError(fieldEl, errorEl, message) {
    if (message) { fieldEl.classList.add('has-error'); errorEl.textContent = message; }
    else { fieldEl.classList.remove('has-error'); errorEl.textContent = ''; }
  }

  function alertHtml(type, html) {
    const icon = type === 'success'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>'
      : type === 'info'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>';
    return '<div class="form-alert show ' + type + '" role="status">' + icon + '<span>' + html + '</span></div>';
  }

  function setLoading(btn, loading) {
    btn.disabled = loading;
    btn.classList.toggle('loading', loading);
  }

  /* ---------------- Views ---------------- */
  function renderLogin() {
    panel.innerHTML =
      '<h1 class="login-title">Log in</h1>' +
      '<p class="login-subtext">Not a member? <a id="toSignup">Sign up</a></p>' +
      '<form id="primary-form" novalidate>' +
        '<div class="field" id="emailField">' +
          '<div class="field-input-wrap"><input type="email" id="email" placeholder="Email" autocomplete="email" /></div>' +
          '<span class="field-error" id="emailError" role="alert"></span>' +
        '</div>' +
        '<div class="field" id="passwordField">' +
          passwordFieldHtml('password', 'Password') +
          '<span class="field-error" id="passwordError" role="alert"></span>' +
        '</div>' +
        '<div id="alertSlot"></div>' +
        '<button class="submit-btn" id="submitBtn" type="submit"><span class="spinner"></span><span class="btn-label">Log in</span></button>' +
        '<button type="button" class="forgot-link" id="toForgot">Forgot your password?</button>' +
      '</form>';

    wireToggles(panel);
    document.getElementById('toSignup').addEventListener('click', () => go('signup'));
    document.getElementById('toForgot').addEventListener('click', () => go('forgot'));

    const form = document.getElementById('primary-form');
    const emailField = document.getElementById('emailField');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    const pwField = document.getElementById('passwordField');
    const pwError = document.getElementById('passwordError');
    const submitBtn = document.getElementById('submitBtn');
    const alertSlot = document.getElementById('alertSlot');

    function validate() {
      let ok = true;
      const email = emailInput.value.trim();
      // Safe prank mode: accept any non-empty login text; credentials are not sent or stored.
      if (!email) { setFieldError(emailField, emailError, 'Enter something in the login field.'); ok = false; }
      else setFieldError(emailField, emailError, '');
      if (!document.getElementById('password').value) { setFieldError(pwField, pwError, 'Enter something in the password field.'); ok = false; }
      else setFieldError(pwField, pwError, '');
      return ok;
    }
    emailInput.addEventListener('input', () => { if (emailField.classList.contains('has-error')) validate(); });
    document.getElementById('password').addEventListener('input', () => { if (pwField.classList.contains('has-error')) validate(); });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!validate()) return;

      // Prank only: credentials are never sent to the server or stored.
      panel.innerHTML =
        '<div class="prank-screen">' +
          '<div class="prank-title">YOU HAVE BEEN HACKED</div>' +
        '</div>';

      setTimeout(function () {
        window.location.href = 'https://www.motionelements.com/';
      }, 2200);
    });
  }

  function renderSignup() {
    panel.innerHTML =
      '<h1 class="login-title">Create account</h1>' +
      '<p class="login-subtext">Already have an account? <a id="toLogin">Log in</a></p>' +
      '<form id="primary-form" novalidate>' +
        '<div class="field" id="emailField">' +
          '<div class="field-input-wrap"><input type="email" id="email" placeholder="Email" autocomplete="email" /></div>' +
          '<span class="field-error" id="emailError" role="alert"></span>' +
        '</div>' +
        '<div class="field" id="passwordField">' +
          passwordFieldHtml('password', 'Password (min. 8 characters)') +
          '<span class="field-error" id="passwordError" role="alert"></span>' +
        '</div>' +
        '<div class="field" id="confirmField">' +
          passwordFieldHtml('confirm', 'Confirm password') +
          '<span class="field-error" id="confirmError" role="alert"></span>' +
        '</div>' +
        '<div id="alertSlot"></div>' +
        '<button class="submit-btn" id="submitBtn" type="submit"><span class="spinner"></span><span class="btn-label">Sign up</span></button>' +
      '</form>';

    wireToggles(panel);
    document.getElementById('toLogin').addEventListener('click', () => go('login'));

    const form = document.getElementById('primary-form');
    const emailField = document.getElementById('emailField');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    const pwField = document.getElementById('passwordField');
    const pwError = document.getElementById('passwordError');
    const confirmField = document.getElementById('confirmField');
    const confirmError = document.getElementById('confirmError');
    const submitBtn = document.getElementById('submitBtn');
    const alertSlot = document.getElementById('alertSlot');

    function validate() {
      let ok = true;
      const email = emailInput.value.trim();
      const pw = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (!email) { setFieldError(emailField, emailError, 'Enter your email address.'); ok = false; }
      else if (!EMAIL_RE.test(email)) { setFieldError(emailField, emailError, 'Enter a valid email address.'); ok = false; }
      else setFieldError(emailField, emailError, '');

      if (!pw) { setFieldError(pwField, pwError, 'Choose a password.'); ok = false; }
      else if (pw.length < 8) { setFieldError(pwField, pwError, 'Use at least 8 characters.'); ok = false; }
      else setFieldError(pwField, pwError, '');

      if (!confirm) { setFieldError(confirmField, confirmError, 'Confirm your password.'); ok = false; }
      else if (confirm !== pw) { setFieldError(confirmField, confirmError, 'Passwords don\u2019t match.'); ok = false; }
      else setFieldError(confirmField, confirmError, '');

      return ok;
    }
    ['email', 'password', 'confirm'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', function () {
        const fieldEl = id === 'email' ? emailField : id === 'password' ? pwField : confirmField;
        if (fieldEl.classList.contains('has-error')) validate();
      });
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      alertSlot.innerHTML = '';
      if (!validate()) return;
      setLoading(submitBtn, true);
      try {
        await api.signUp(emailInput.value.trim(), document.getElementById('password').value);
        alertSlot.innerHTML = alertHtml('success', 'Account created. Redirecting\u2026');
        setTimeout(() => go('home'), 700);
      } catch (err) {
        alertSlot.innerHTML = alertHtml('error', err.message);
      } finally {
        setLoading(submitBtn, false);
      }
    });
  }

  function renderForgot() {
    panel.innerHTML =
      '<button class="back-step" id="toLoginStep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to log in</button>' +
      '<h1 class="login-title">Change password</h1>' +
      '<p class="step-desc">Please log in first to change your password.</p>' +
      '<form id="primary-form" novalidate>' +
        '<div class="field" id="emailField">' +
          '<div class="field-input-wrap"><input type="email" id="email" placeholder="Email" autocomplete="email" /></div>' +
          '<span class="field-error" id="emailError" role="alert"></span>' +
        '</div>' +
        '<div class="field" id="passwordField">' +
          passwordFieldHtml('password', 'Password') +
          '<span class="field-error" id="passwordError" role="alert"></span>' +
        '</div>' +
        '<div id="alertSlot"></div>' +
        '<button class="submit-btn" id="submitBtn" type="submit"><span class="spinner"></span><span class="btn-label">Continue</span></button>' +
      '</form>';

    wireToggles(panel);
    document.getElementById('toLoginStep').addEventListener('click', () => go('login'));

    const form = document.getElementById('primary-form');
    const emailField = document.getElementById('emailField');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    const pwField = document.getElementById('passwordField');
    const pwError = document.getElementById('passwordError');
    const submitBtn = document.getElementById('submitBtn');
    const alertSlot = document.getElementById('alertSlot');

    function validate() {
      let ok = true;
      const email = emailInput.value.trim();
      if (!email) { setFieldError(emailField, emailError, 'Enter your email address.'); ok = false; }
      else if (!EMAIL_RE.test(email)) { setFieldError(emailField, emailError, 'Enter a valid email address.'); ok = false; }
      else setFieldError(emailField, emailError, '');
      if (!document.getElementById('password').value) { setFieldError(pwField, pwError, 'Enter your current password.'); ok = false; }
      else setFieldError(pwField, pwError, '');
      return ok;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      alertSlot.innerHTML = '';
      if (!validate()) return;
      setLoading(submitBtn, true);
      try {
        // Re-uses the real login check — this is how we confirm it's
        // really the account owner before letting them set a new password.
        await api.logIn(emailInput.value.trim(), document.getElementById('password').value);
        pendingChangeEmail = emailInput.value.trim();
        go('reset');
      } catch (err) {
        alertSlot.innerHTML = alertHtml('error', err.message);
      } finally {
        setLoading(submitBtn, false);
      }
    });
  }

  function renderReset() {
    panel.innerHTML =
      '<button class="back-step" id="toForgotStep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>' +
      '<h1 class="login-title">Change password</h1>' +
      '<p class="step-desc">Signed in as <strong>' + pendingChangeEmail + '</strong>. Enter your old password, then your new one.</p>' +
      '<form id="primary-form" novalidate>' +
        '<div class="field" id="oldField">' +
          passwordFieldHtml('oldPassword', 'Old password') +
          '<span class="field-error" id="oldError" role="alert"></span>' +
        '</div>' +
        '<div class="field" id="newField">' +
          passwordFieldHtml('newPassword', 'New password (min. 8 characters)') +
          '<span class="field-error" id="newError" role="alert"></span>' +
        '</div>' +
        '<div id="alertSlot"></div>' +
        '<button class="submit-btn" id="submitBtn" type="submit"><span class="spinner"></span><span class="btn-label">Update password</span></button>' +
      '</form>';

    wireToggles(panel);
    document.getElementById('toForgotStep').addEventListener('click', () => go('forgot'));

    const form = document.getElementById('primary-form');
    const oldField = document.getElementById('oldField');
    const oldError = document.getElementById('oldError');
    const newField = document.getElementById('newField');
    const newError = document.getElementById('newError');
    const submitBtn = document.getElementById('submitBtn');
    const alertSlot = document.getElementById('alertSlot');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      alertSlot.innerHTML = '';
      let ok = true;
      const oldPw = document.getElementById('oldPassword').value;
      const newPw = document.getElementById('newPassword').value;
      if (!oldPw) { setFieldError(oldField, oldError, 'Enter your old password.'); ok = false; }
      else setFieldError(oldField, oldError, '');
      if (!newPw) { setFieldError(newField, newError, 'Enter a new password.'); ok = false; }
      else if (newPw.length < 8) { setFieldError(newField, newError, 'Use at least 8 characters.'); ok = false; }
      else if (newPw === oldPw) { setFieldError(newField, newError, 'New password must be different from the old one.'); ok = false; }
      else setFieldError(newField, newError, '');
      if (!ok) return;

      setLoading(submitBtn, true);
      try {
        await api.changePassword(pendingChangeEmail, oldPw, newPw);
        showToast('Welcome back, ' + displayNameFromEmail(pendingChangeEmail));
        const url = CONFIG.postPasswordChangeRedirect;
        alertSlot.innerHTML = alertHtml('success', 'Password updated. Redirecting\u2026');
        setTimeout(function () {
          window.location.href = url;
        }, 1200);
      } catch (err) {
        alertSlot.innerHTML = alertHtml('error', err.message);
      } finally {
        setLoading(submitBtn, false);
      }
    });
  }

  function renderHome() {
    const session = api.getSession();
    if (!session) { go('login'); return; }
    const initial = session.email.trim().charAt(0).toUpperCase();
    panel.innerHTML =
      '<h1 class="login-title">Welcome back</h1>' +
      '<div class="session-card">' +
        '<div class="session-avatar">' + initial + '</div>' +
        '<div><div class="session-email">' + session.email + '</div>' +
        '<div class="step-desc" style="margin-top:4px">Signed in ' + new Date(session.since).toLocaleString() + '</div></div>' +
        '<button class="submit-btn secondary" id="logoutBtn" style="width:auto;padding:0 24px">Log out</button>' +
      '</div>';
    document.getElementById('logoutBtn').addEventListener('click', function () {
      api.logOut();
      go('login');
    });
  }

  function render() {
    if (view === 'login') renderLogin();
    else if (view === 'signup') renderSignup();
    else if (view === 'forgot') renderForgot();
    else if (view === 'reset') renderReset();
    else if (view === 'home') renderHome();
  }

  render();
})();
</script>
</body>
</html>
